[package]
name = "horizon-mod-better-f1-reborn"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Better F1 Reborn ported to Horizon (1:1 HUD state machine core on the mod API). Upstream: github.com/MovTery/Better-F1-Reborn, MIT (c) 2024 MovTery."

[lib]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
